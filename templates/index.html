<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Slot Machine</title>
  <style>
    body {
      background: #211636;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }

    h1 { color: gold; }

    .machine {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 30px auto;
    }

    .reel {
      background: white;
      border: 4px solid gold;
      border-radius: 12px;
      width: 90px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    button {
      background: gold;
      border: none;
      border-radius: 10px;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: orange; }
    button:disabled { opacity: 0.5; }

    #result {
      font-size: 24px;
      margin: 25px;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h1>🎰 SLOT MACHINE 🎰</h1>

  <div class="machine">
    <div class="reel" id="r1">🍒</div>
    <div class="reel" id="r2">🍋</div>
    <div class="reel" id="r3">💎</div>
  </div>

  <button id="spinButton" onclick="spin()">SPIN</button>

  <div id="result">Hodně štěstí!</div>
<script src="script.js"></script>
</body>
</html>
